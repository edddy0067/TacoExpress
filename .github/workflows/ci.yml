name: TacoExpress CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-android:
    name: Compilar y validar Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Mostrar información de .NET
        run: dotnet --info

      - name: Instalar workload MAUI Android
        run: dotnet workload install maui-android

      - name: Restaurar dependencias
        run: >
          dotnet restore
          TacoExpress/MauiApp8/MauiApp8.csproj
          -p:TargetFramework=net9.0-android

      - name: Análisis estático
        run: >
          dotnet format
          TacoExpress/MauiApp8/MauiApp8.csproj
          --verify-no-changes
          --no-restore

      - name: Compilar aplicación Android
        run: >
          dotnet build
          TacoExpress/MauiApp8/MauiApp8.csproj
          --configuration Release
          --framework net9.0-android
          --no-restore

      - name: Buscar y ejecutar pruebas
        shell: bash
        run: |
          TEST_PROJECTS=$(find TacoExpress \
            \( -name "*Tests.csproj" -o -name "*Test.csproj" \) \
            -not -path "*/bin/*" \
            -not -path "*/obj/*")

          if [ -z "$TEST_PROJECTS" ]; then
            echo "No se encontraron proyectos de pruebas."
            echo "El pipeline continúa, pero se recomienda agregar pruebas unitarias."
          else
            for project in $TEST_PROJECTS; do
              echo "Ejecutando pruebas de: $project"
              dotnet test "$project" \
                --configuration Release \
                --verbosity normal
            done
          fi